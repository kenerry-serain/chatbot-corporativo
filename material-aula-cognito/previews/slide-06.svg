  <text x="1080" y="536" fill="#dc2626" font-family="'Courier New', monospace" font-size="16" font-weight="500" text-anchor="start"><tspan x="1080" dy="0">NÃO</tspan></text>
  <rect x="310" y="615" width="530" height="135" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="2" opacity="1" />
  <text x="345" y="663" fill="#dc2626" font-family="'Courier New', monospace" font-size="22" font-weight="500" text-anchor="start"><tspan x="345" dy="0">401 — UNAUTHENTICATED</tspan></text>
  <text x="345" y="704" fill="#0b0f19" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="345" dy="0">Token ausente, expirado ou com</tspan><tspan x="345" dy="23.75">assinatura/issuer/audience inválidos.</tspan></text>
  <rect x="880" y="615" width="530" height="135" rx="0" fill="#ffffff" stroke="#dc2626" stroke-width="2" opacity="1" />
