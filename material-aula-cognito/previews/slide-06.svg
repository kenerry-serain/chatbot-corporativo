  <text x="1330" y="328" fill="#0b0f19" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="start"><tspan x="1330" dy="0">Lambda / API</tspan></text>
  <text x="1330" y="364" fill="#0f2f70" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="1330" dy="0">Recebe claims validados</tspan><tspan x="1330" dy="22.5">sub, scopes, grupos</tspan><tspan x="1330" dy="22.5">e executa a regra de negócio</tspan></text>
