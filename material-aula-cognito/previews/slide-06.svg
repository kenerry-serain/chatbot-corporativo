  <text x="430" y="365" fill="#0f2f70" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="430" dy="0">JWT authorizer</tspan><tspan x="430" dy="23.75">issuer + audience</tspan><tspan x="430" dy="23.75">assinatura + expiração</tspan></text>
  <polygon points="795,310 880,390 795,470 710,390" fill="#eff6ff" stroke="#2563eb" stroke-width="3" opacity="1"/>
