  <text x="140" y="389" fill="#0f2f70" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="140" dy="0">Bearer</tspan><tspan x="140" dy="22.5">access token</tspan></text>
