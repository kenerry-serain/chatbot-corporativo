  <text x="915" y="704" fill="#0b0f19" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="915" dy="0">Identidade válida, mas sem scope,</tspan><tspan x="915" dy="23.75">grupo ou permissão para a operação.</tspan></text>
