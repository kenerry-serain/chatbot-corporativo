  <text x="485" y="632" fill="#0b0f19" font-family="'Courier New', monospace" font-size="27" font-weight="500" text-anchor="start"><tspan x="485" dy="0">getCurrentUser()</tspan></text>
  <text x="790" y="633" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="middle"><tspan x="790" dy="0">+</tspan></text>
  <text x="835" y="632" fill="#0b0f19" font-family="'Courier New', monospace" font-size="27" font-weight="500" text-anchor="start"><tspan x="835" dy="0">fetchAuthSession()</tspan></text>
  <text x="1160" y="630" fill="#0f2f70" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start"><tspan x="1160" dy="0">→ usuário logado</tspan></text>
  <text x="185" y="689" fill="#0f2f70" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start"><tspan x="185" dy="0">Recuperação de senha: resetPassword() → código → confirmResetPassword().</tspan></text>
