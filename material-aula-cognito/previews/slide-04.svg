  <text x="70" y="181" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start"><tspan x="70" dy="0">Amplify abstrai as chamadas, mas o User Pool continua sendo a autoridade de autenticação.</tspan></text>
