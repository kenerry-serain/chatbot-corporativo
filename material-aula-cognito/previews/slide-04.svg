  <text x="470" y="357" fill="#0f2f70" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="470" dy="0">signIn({ username,</tspan><tspan x="470" dy="22.5">password })</tspan></text>
